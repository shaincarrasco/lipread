[package]
name = "lipread-decoder"
version = "0.1.0"
edition = "2021"
description = "LipRead context-aware CTC decoder (word trigram LM + prefix beam search), native and WebAssembly"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.104"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }   # exact float parsing (options, fixtures)

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Note: cargo ignores `panic` for test harnesses, so `cargo test --release` still unwinds.
