[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lipread"
version = "0.1.0"
description = "AI lip reading for any video, tuned for sports clips: players, coaches and fans."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=2",
  "opencv-python-headless>=4.9",
  "mediapipe>=0.10.14",
  "onnxruntime>=1.18",
  "sentencepiece>=0.2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
url = ["yt-dlp>=2024.1.0"]
eval = ["jiwer>=3.0", "pyarrow>=15", "faster-whisper>=1.0"]
dev = ["pytest>=8", "jiwer>=3.0", "httpx>=0.27"]

[project.scripts]
lipread = "lipread.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lipread = ["assets/*", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: needs the downloaded lip-reading model (slow)"]
