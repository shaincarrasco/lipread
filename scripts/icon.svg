  </g>

  <!-- lip highlight -->
  <path d="M 300 448 C 360 420, 420 418, 470 430" fill="none" stroke="#ffd1f3" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round"/>
</svg>
