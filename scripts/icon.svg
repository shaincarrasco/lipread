<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1b1430"/>
      <stop offset="60%" stop-color="#0b0814"/>
      <stop offset="100%" stop-color="#040306"/>
    </radialGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7ae0"/>
      <stop offset="55%" stop-color="#ff2bd6"/>
      <stop offset="100%" stop-color="#b3108f"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7cf7ff"/>
    </linearGradient>
    <filter id="glowL" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowC" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- rounded tile, macOS icon-grid margins -->
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="none" stroke="#00f0ff" stroke-opacity="0.55" stroke-width="6"/>

  <!-- scan lines for texture -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="2">
    <line x1="100" y1="260" x2="924" y2="260"/>
    <line x1="100" y1="380" x2="924" y2="380"/>
    <line x1="100" y1="620" x2="924" y2="620"/>
    <line x1="100" y1="740" x2="924" y2="740"/>
  </g>

  <!-- lips: neon magenta, blurred halo first -->
  <g filter="url(#glowL)">
    <path d="M 214 500 C 300 384, 420 404, 512 436 C 604 404, 724 384, 810 500 C 752 470, 640 458, 512 472 C 384 458, 272 470, 214 500 Z" fill="url(#lip)"/>
    <path d="M 214 500 C 272 530, 384 528, 512 528 C 640 528, 752 530, 810 500 C 760 616, 650 668, 512 662 C 374 668, 264 616, 214 500 Z" fill="url(#lip)"/>
  </g>
  <!-- dark mouth slit so the waveform reads inside it -->
  <path d="M 268 500 C 380 478, 644 478, 756 500 C 644 520, 380 520, 268 500 Z" fill="#07050c"/>

  <!-- waveform: cyan, glowing -->
  <g filter="url(#glowC)" fill="none" stroke="url(#wave)" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
