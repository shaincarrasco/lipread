<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Not Found - LipRead</title>
  <link rel="icon" href="./icons/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <style>
    :root {
      --bg: #F2F2F7;
      --card: #FFFFFF;
      --label: #000000;
      --secondary: rgba(60, 60, 67, 0.6);
      --tint: #007AFF;
      --on-tint: #FFFFFF;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #000000;
        --card: #1C1C1E;
        --label: #FFFFFF;
        --secondary: rgba(235, 235, 245, 0.6);
        --tint: #0A84FF;
        --on-tint: #FFFFFF;
      }
    }
    :root[data-theme="dark"] {
      --bg: #000000;
      --card: #1C1C1E;
      --label: #FFFFFF;
      --secondary: rgba(235, 235, 245, 0.6);
      --tint: #0A84FF;
      --on-tint: #FFFFFF;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--label);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }
    main {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .code {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--secondary);
      margin: 0 0 8px;
    }
    h1 {
      font-size: 34px;
      font-weight: 700;
      letter-spacing: -0.4px;
      line-height: 1.15;
      margin: 0 0 12px;
    }
    p {
      font-size: 17px;
      line-height: 1.4;
      color: var(--secondary);
      margin: 0 auto 28px;
      max-width: 340px;
    }
    a.button {
      display: inline-block;
      background: var(--tint);
      color: var(--on-tint);
      text-decoration: none;
      font-size: 17px;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 14px;
      min-height: 44px;
    }
    a.button:focus-visible { outline: 3px solid var(--tint); outline-offset: 3px; }
    @media (prefers-reduced-motion: no-preference) {
      a.button { transition: opacity 0.15s ease; }
      a.button:active { opacity: 0.6; }
    }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Page Not Found</h1>
    <p>The page you were looking for does not exist or has moved.</p>
    <a class="button" href="./">Back to LipRead</a>
  </main>
</body>
</html>
